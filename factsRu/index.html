<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25 фактов о России · Интерактивная презентация</title>
    <style>
        /* ----- RESET & GLOBAL ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            background: #0a0f1e;
            background-image: radial-gradient(circle at 20% 20%, #1a2a4a 0%, #0a0f1e 70%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #eef2ff;
            overflow-x: hidden;
        }

        /* ----- ЗАГОЛОВОК / ШАПКА ----- */
        .app-header {
            text-align: center;
            margin-bottom: 1.8rem;
            animation: fadeSlideDown 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .app-header h1 {
            font-size: clamp(1.8rem, 6vw, 3.2rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #a0c4ff 45%, #d0bfff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            text-shadow: 0 0 40px rgba(100, 150, 255, 0.3);
        }

        .app-header .subtitle {
            font-size: clamp(0.9rem, 2.5vw, 1.15rem);
            color: #8ea4c8;
            margin-top: 0.4rem;
            font-weight: 400;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .counter-badge {
            display: inline-block;
            margin-top: 0.75rem;
            padding: 0.25rem 1.4rem;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            font-size: 0.85rem;
            color: #b8ceff;
            letter-spacing: 0.08em;
            font-weight: 500;
            transition: 0.3s;
        }

        /* ----- КАРТОЧКА ФАКТА ----- */
        .card-container {
            width: 100%;
            max-width: 880px;
            perspective: 1200px;
            margin-bottom: 1.5rem;
        }

        .fact-card {
            position: relative;
            background: rgba(18, 30, 55, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 2rem;
            padding: clamp(1.8rem, 6vw, 3.2rem) clamp(1.5rem, 5vw, 3rem);
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8),
                        0 0 0 1px rgba(255, 255, 255, 0.04) inset,
                        0 0 80px -20px rgba(100, 150, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.25s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.3s;
            will-change: transform;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transform-style: preserve-3d;
            animation: cardAppear 0.55s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .fact-card:hover {
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.9),
                        0 0 0 1px rgba(255, 255, 255, 0.06) inset,
                        0 0 100px -20px rgba(130, 170, 255, 0.25);
            transform: translateY(-4px) scale(1.002);
        }

        .fact-number {
            position: absolute;
            top: 1.2rem;
            left: 1.8rem;
            font-size: clamp(3.5rem, 12vw, 5.5rem);
            font-weight: 800;
            line-height: 1;
            color: rgba(180, 210, 255, 0.09);
            letter-spacing: -0.05em;
            user-select: none;
            transition: color 0.4s, transform 0.4s;
            font-family: 'Inter', system-ui, sans-serif;
            z-index: 0;
        }

        .fact-card:hover .fact-number {
            color: rgba(180, 210, 255, 0.16);
            transform: scale(1.02) translateX(4px);
        }

        .fact-text {
            position: relative;
            z-index: 2;
            font-size: clamp(1.15rem, 3.2vw, 1.7rem);
            line-height: 1.55;
            font-weight: 450;
            color: #f0f5ff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
            letter-spacing: -0.01em;
            padding-left: clamp(0rem, 3vw, 2.5rem);
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            word-break: break-word;
        }

        /* Акцент в тексте (числа и т.п. — не меняем, просто стиль) */

        /* ----- АНИМАЦИИ ----- */
        @keyframes fadeSlideDown {
            0% { opacity: 0; transform: translateY(-28px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes cardAppear {
            0% { opacity: 0; transform: scale(0.94) rotateX(8deg) translateY(24px); }
            100% { opacity: 1; transform: scale(1) rotateX(0deg) translateY(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(120, 160, 255, 0.2); }
            70% { box-shadow: 0 0 0 18px rgba(120, 160, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(120, 160, 255, 0); }
        }

        .fact-card.changed {
            animation: cardAppear 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* ----- НАВИГАЦИЯ ----- */
        .nav-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(0.8rem, 3vw, 2rem);
            margin-top: 1.2rem;
            flex-wrap: wrap;
            animation: fadeSlideDown 0.9s 0.15s both cubic-bezier(0.23, 1, 0.32, 1);
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e0ecff;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            user-select: none;
            flex-shrink: 0;
            line-height: 1;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.5);
        }

        .nav-btn:hover {
            background: rgba(160, 195, 255, 0.15);
            border-color: rgba(180, 210, 255, 0.3);
            transform: scale(1.06);
            color: #ffffff;
            box-shadow: 0 12px 28px -8px rgba(80, 140, 255, 0.3);
        }

        .nav-btn:active {
            transform: scale(0.94);
            background: rgba(160, 195, 255, 0.25);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            pointer-events: none;
            transform: none;
            box-shadow: none;
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: #a6bce2;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.4rem 1rem 0.4rem 1.4rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }

        .progress-bar {
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-left: 0.2rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7aa5ff, #c5b4ff);
            border-radius: 4px;
            transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 0 12px rgba(120, 160, 255, 0.5);
            width: 4%;
        }

        /* ----- ДОП. КНОПКИ (внизу) ----- */
        .extra-actions {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 1.4rem;
            flex-wrap: wrap;
            animation: fadeSlideDown 1s 0.25s both cubic-bezier(0.23, 1, 0.32, 1);
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #c0d4f0;
            padding: 0.55rem 1.6rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.25s;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pill-btn:hover {
            background: rgba(160, 195, 255, 0.12);
            border-color: rgba(180, 210, 255, 0.25);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .pill-btn:active {
            transform: scale(0.96);
        }

        /* ----- АДАПТИВ ----- */
        @media (max-width: 600px) {
            .fact-card {
                border-radius: 1.6rem;
                padding: 1.8rem 1.4rem;
                min-height: 190px;
            }
            .fact-number {
                top: 0.8rem;
                left: 1.2rem;
                font-size: 3.4rem;
            }
            .fact-text {
                font-size: 1.1rem;
                padding-left: 0.2rem;
            }
            .nav-btn {
                width: 48px;
                height: 48px;
                font-size: 1.4rem;
            }
            .progress-bar {
                width: 70px;
            }
            .progress-wrapper {
                gap: 0.4rem;
                padding: 0.3rem 0.8rem 0.3rem 1rem;
                font-size: 0.8rem;
            }
            .extra-actions {
                gap: 0.8rem;
            }
            .pill-btn {
                padding: 0.4rem 1.1rem;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 400px) {
            body { padding: 0.8rem; }
            .fact-text { font-size: 1rem; }
            .nav-controls { gap: 0.5rem; }
            .progress-bar { width: 50px; }
        }

        /* Декоративная подсветка */
        .glow-orb {
            position: fixed;
            width: 45vmax;
            height: 45vmax;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(90, 140, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
            top: -15vmax;
            right: -15vmax;
            z-index: 0;
            animation: floatOrb 18s infinite alternate ease-in-out;
        }

        .glow-orb.two {
            width: 35vmax;
            height: 35vmax;
            background: radial-gradient(circle, rgba(200, 160, 255, 0.06) 0%, transparent 70%);
            bottom: -12vmax;
            left: -12vmax;
            top: auto;
            right: auto;
            animation-duration: 22s;
            animation-delay: -5s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-6vmax, 6vmax) scale(1.15); }
        }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    <div class="glow-orb two"></div>

    <header class="app-header">
        <h1>25 фактов о России</h1>
        <div class="subtitle">интерактивная презентация</div>
        <div class="counter-badge" id="counterBadge">факт 1 / 25</div>
    </header>

    <main class="card-container">
        <div class="fact-card" id="factCard">
            <div class="fact-number" id="factNumber">01</div>
            <div class="fact-text" id="factText">Россия — самая большая страна в мире по площади: более 17 миллионов квадратных километров.</div>
        </div>
    </main>

    <div class="nav-controls">
        <button class="nav-btn" id="prevBtn" aria-label="Предыдущий факт" disabled>‹</button>
        <div class="progress-wrapper">
            <span id="progressLabel">1 / 25</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 4%;"></div>
            </div>
        </div>
        <button class="nav-btn" id="nextBtn" aria-label="Следующий факт">›</button>
    </div>

    <div class="extra-actions">
        <button class="pill-btn" id="randomBtn">🎲 Случайный факт</button>
        <button class="pill-btn" id="resetBtn">↻ В начало</button>
    </div>

    <script>
        (function() {
            // ---- Данные из JSON (встроены) ----
            const facts = [
                "Россия — самая большая страна в мире по площади: более 17 миллионов квадратных километров.",
                "Территория России омывается водами 12 морей, принадлежащих трём океанам: Атлантическому, Тихому и Северному Ледовитому.",
                "В России находится озеро Байкал — самое глубокое озеро в мире (около 1642 метров) и крупнейший резервуар пресной воды.",
                "Россия граничит с 18 государствами — это одно из наибольших количеств соседних стран в мире.",
                "На территории России расположены одни из самых старых гор на планете — Уральские; возраст некоторых горных образований превышает 4 миллиарда лет.",
                "Московский Кремль — крупнейшая сохранившаяся действующая средневековая крепость в Европе.",
                "В Санкт‑Петербурге находится самое глубокое метро в мире: средняя глубина станций — около 100 метров, а некоторые — ещё глубже.",
                "В России проживает более 190 народов, говорящих на разных языках и сохраняющих свои традиции.",
                "Ключевская Сопка на Камчатке — один из самых активных и крупнейших действующих вулканов Евразии (высота — более 4750 метров).",
                "В городе Оймякон (Якутия) зафиксирована одна из самых низких температур в обитаемом Северном полушарии — ниже −70 °C.",
                "Транссибирская железнодорожная магистраль — самая длинная пассажирская железная дорога в мире, её протяжённость — более 9200 километров.",
                "В России находится самая большая в мире площадь лесов — они занимают более 8 миллионов квадратных километров.",
                "Волга — самая длинная река в Европе, её длина составляет более 3500 километров.",
                "Эльбрус — высочайшая точка России и Европы, его высота — 5642 метра над уровнем моря.",
                "В России более 2,8 миллиона рек и свыше 2 миллионов озёр.",
                "Санкт‑Петербург называют «Северной Венецией»: в городе более 90 рек, каналов и протоков, а также свыше 300 мостов.",
                "Россия охватывает 11 часовых поясов — это больше, чем любая другая страна мира.",
                "Эрмитаж в Санкт‑Петербурге — один из крупнейших и старейших музеев мира: в нём хранится более 3 миллионов произведений искусства.",
                "В Якутии добывают значительную часть мировых запасов алмазов; регион известен крупнейшими в мире алмазными карьерами.",
                "Русская баня — важная часть культуры; традиционные бани топят по‑чёрному и по‑белому, а ритуал парения включает использование веников.",
                "Первый человек в космосе — Юрий Гагарин из СССР (1961 год); этот факт остаётся важной частью российской и мировой истории.",
                "В России есть уникальные природные зоны: от арктических пустынь на севере до субтропиков на юге (например, в Сочи).",
                "Соляные пещеры в Пермском крае (например, на территории бывшего рудника в Соликамске) — одни из крупнейших в Европе.",
                "В России сохранились уникальные деревянные храмы Русского Севера, построенные без единого гвоздя.",
                "Русский язык — один из шести официальных языков ООН и входит в число самых распространённых языков мира по числу носителей."
            ];

            // ---- DOM ----
            const factCard = document.getElementById('factCard');
            const factNumberEl = document.getElementById('factNumber');
            const factTextEl = document.getElementById('factText');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const randomBtn = document.getElementById('randomBtn');
            const resetBtn = document.getElementById('resetBtn');
            const counterBadge = document.getElementById('counterBadge');
            const progressLabel = document.getElementById('progressLabel');
            const progressFill = document.getElementById('progressFill');

            let currentIndex = 0; // 0-based
            const total = facts.length;

            // ---- Вспомогательные ----
            function formatNumber(num) {
                return String(num).padStart(2, '0');
            }

            // Обновить UI с анимацией
            function renderFact(index, animate = true) {
                // Защита от выхода за границы
                if (index < 0) index = 0;
                if (index >= total) index = total - 1;
                if (index === currentIndex && animate) {
                    // всё равно обновим, но без лишней анимации? — нет, принудительно перерисуем
                }
                currentIndex = index;

                // Данные
                const numberStr = formatNumber(index + 1);
                const factStr = facts[index];

                // Применяем анимацию через класс (перезапуск)
                if (animate) {
                    factCard.classList.remove('changed');
                    // Форсируем reflow
                    void factCard.offsetWidth;
                    factCard.classList.add('changed');
                }

                // Обновляем контент
                factNumberEl.textContent = numberStr;
                factTextEl.textContent = factStr;

                // Счётчики и прогресс
                const humanNumber = index + 1;
                counterBadge.textContent = `факт ${humanNumber} / ${total}`;
                progressLabel.textContent = `${humanNumber} / ${total}`;
                const percent = (humanNumber / total) * 100;
                progressFill.style.width = percent + '%';

                // Кнопки
                prevBtn.disabled = (index === 0);
                nextBtn.disabled = (index === total - 1);
            }

            // ---- Обработчики ----
            function goPrev() {
                if (currentIndex > 0) {
                    renderFact(currentIndex - 1, true);
                }
            }

            function goNext() {
                if (currentIndex < total - 1) {
                    renderFact(currentIndex + 1, true);
                }
            }

            function goRandom() {
                let newIndex;
                if (total <= 1) return;
                do {
                    newIndex = Math.floor(Math.random() * total);
                } while (newIndex === currentIndex && total > 1);
                renderFact(newIndex, true);
            }

            function goReset() {
                renderFact(0, true);
            }

            // ---- Навешиваем события ----
            prevBtn.addEventListener('click', goPrev);
            nextBtn.addEventListener('click', goNext);
            randomBtn.addEventListener('click', goRandom);
            resetBtn.addEventListener('click', goReset);

            // Клавиатура
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    goPrev();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    goNext();
                } else if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
                    // случайный факт (R / К)
                    if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                        e.preventDefault();
                        goRandom();
                    }
                } else if (e.key === 'Home' || e.key === 'home' || e.key === 'г' || e.key === 'Г') {
                    e.preventDefault();
                    goReset();
                }
            });

            // Свайпы для мобильных (опционально, улучшает UX)
            let touchStartX = 0;
            let touchEndX = 0;
            factCard.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            factCard.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) {
                        goPrev(); // свайп вправо -> назад
                    } else {
                        goNext(); // свайп влево -> вперёд
                    }
                }
            }, { passive: true });

            // ---- Инициализация ----
            renderFact(0, false); // без анимации при первой загрузке, но счётчики выставим
            // Легкая анимация появления уже есть у карточки при загрузке
            // Убедимся, что кнопки в правильном состоянии
            prevBtn.disabled = true;
            nextBtn.disabled = (total <= 1);

            // Доп: начальный прогресс (уже в CSS 4%, но выставим корректно)
            progressFill.style.width = (1 / total * 100) + '%';
        })();
    </script>
</body>
  </html>
