<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects · q-acd</title>
<meta name="description" content="Хаб проектов q-acd: лицензии, презентации, эксперименты.">
<meta property="og:title" content="Projects · q-acd">
<meta property="og:description" content="Хаб проектов q-acd.">
<meta property="og:type" content="website">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0f1e;
    --card: rgba(18, 30, 55, 0.72);
    --border: rgba(255, 255, 255, 0.07);
    --text: #eef2ff;
    --muted: #8ea4c8;
    --accent: #7aa5ff;
    --accent2: #c5b4ff;
    --radius: 18px;
  }

  html[data-theme="light"] {
    --bg: #f4f6fb;
    --card: rgba(255, 255, 255, 0.85);
    --border: rgba(10, 20, 40, 0.08);
    --text: #0f1a2e;
    --muted: #5b6b85;
  }

  body {
    font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(circle at 20% 0%, rgba(90, 140, 255, 0.12) 0%, transparent 55%);
    color: var(--text);
    min-height: 100vh;
    padding: clamp(1.2rem, 4vw, 3rem) clamp(1rem, 4vw, 2rem);
    transition: background 0.3s, color 0.3s;
  }

  .wrap { max-width: 980px; margin: 0 auto; }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.8rem;
    animation: fadeDown 0.7s cubic-bezier(0.23, 1, 0.32, 1) both;
  }

  h1 {
    font-size: clamp(1.7rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--text) 20%, var(--accent) 65%, var(--accent2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle { color: var(--muted); margin-top: 0.35rem; font-size: 0.95rem; }

  .theme-btn {
    width: 42px; height: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px);
    transition: 0.25s;
  }
  .theme-btn:hover { border-color: var(--accent); transform: translateY(-2px); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
    gap: 1.1rem;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    padding: 1.4rem;
    border-radius: var(--radius);
    background: var(--card);
    border: 1px solid var(--border);
    backdrop-filter: blur(14px);
    text-decoration: none;
    color: var(--text);
    overflow: hidden;
    transition: transform 0.28s cubic-bezier(0.23, 1, 0.32, 1),
                border-color 0.28s, box-shadow 0.28s;
    animation: cardIn 0.55s cubic-bezier(0.23, 1, 0.32, 1) both;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: var(--radius);
    background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 50%),
                rgba(122, 165, 255, 0.14), transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .card:hover { transform: translateY(-5px); border-color: rgba(122, 165, 255, 0.35); box-shadow: 0 22px 45px -25px rgba(0,0,0,0.8); }
  .card:hover::after { opacity: 1; }

  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }

  .card h2 {
    font-size: 1.08rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  .card p { color: var(--muted); font-size: 0.87rem; line-height: 1.55; flex: 1; }

  .badge {
    font-size: 0.65rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 700;
    padding: 0.28rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge.beta   { background: rgba(255, 196, 87, 0.14); color: #ffc457; border: 1px solid rgba(255,196,87,0.25); }
  .badge.stable { background: rgba(91, 220, 150, 0.13); color: #5bdc96; border: 1px solid rgba(91,220,150,0.25); }
  .badge.wip    { background: rgba(255, 120, 120, 0.13); color: #ff8888; border: 1px solid rgba(255,120,120,0.25); }

  .card-arrow {
    font-size: 0.8rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.35rem;
    transition: color 0.2s, gap 0.2s;
  }
  .card:hover .card-arrow { color: var(--accent); gap: 0.6rem; }

  footer {
    margin-top: 2.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
    display: flex;
    justify-content: space-between;
    gap: 0.8rem;
    flex-wrap: wrap;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Projects</h1>
      <p class="subtitle">Лицензии, презентации и эксперименты q-acd</p>
    </div>
    <button class="theme-btn" id="themeBtn" title="Сменить тему" aria-label="Сменить тему">🌙</button>
  </header>

  <main class="grid">

    <a class="card" href="/projects/license/HelloMusic/">
      <div class="card-top">
        <h2>HelloMusic License</h2>
        <span class="badge stable">stable</span>
      </div>
      <p>Текст лицензии проекта HelloMusic.</p>
      <div class="card-arrow">Открыть <span>→</span></div>
    </a>

    <a class="card" href="/projects/factsRu/" style="animation-delay: 70ms;">
      <div class="card-top">
        <h2>25 фактов о России</h2>
        <span class="badge beta">beta</span>
      </div>
      <p>Интерактивная презентация с анимациями на ванильном JS. Пролистывание, случайный факт, свайпы.</p>
      <div class="card-arrow">Открыть <span>→</span></div>
    </a>

  </main>

  <footer>
    <span>q-acd · projects</span>
    <span><a href="https://github.com/q-acd/projects" target="_blank" rel="noopener">GitHub</a></span>
  </footer>
</div>

<script>
(function () {
  const themeBtn = document.getElementById('themeBtn');

  // Восстановить тему
  if (localStorage.getItem('theme') === 'light') {
    document.documentElement.dataset.theme = 'light';
    themeBtn.textContent = '☀️';
  }

  themeBtn.addEventListener('click', () => {
    const isLight = document.documentElement.dataset.theme === 'light';
    if (isLight) {
      delete document.documentElement.dataset.theme;
      themeBtn.textContent = '🌙';
      localStorage.setItem('theme', 'dark');
    } else {
      document.documentElement.dataset.theme = 'light';
      themeBtn.textContent = '☀️';
      localStorage.setItem('theme', 'light');
    }
  });

  // Подсветка под курсором на карточках
  document.querySelectorAll('.card').forEach(card => {
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
})();
</script>
</body>
   </html>
